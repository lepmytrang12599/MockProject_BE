<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thống kê doanh thu</title>
    <style>
      :root {
        --primary-color: #007bff;
        --secondary-color: #00c3ff;
        --bg-color: #f4f4f4;
        --text-color: #333;
        --sidebar-bg: linear-gradient(135deg, #2c3e50, #34495e);
        --card-bg: white;
      }
      body {
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        display: flex;
      }
      .sidebar {
        width: 250px;
        background: var(--sidebar-bg);
        color: white;
        height: 100vh;
        position: fixed;
        padding: 20px;
        transition: width 0.3s ease-in-out;
        overflow: hidden;
      }
      .sidebar.collapsed {
        width: 70px;
      }
      .menu-item {
        padding: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: background 0.3s, transform 0.2s;
        border-radius: 5px;
      }
      .menu-item:hover,
      .menu-item.active {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.05);
      }
      .toggle-btn {
        background: none;
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
        display: block;
        margin-bottom: 10px;
      }
      .main-content {
        margin-left: 270px;
        padding: 20px;
        width: calc(100% - 270px);
        transition: margin-left 0.3s ease-in-out;
      }
      .collapsed + .main-content {
        margin-left: 90px;
        width: calc(100% - 90px);
      }
      .charts {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .chart {
        width: 45%;
        min-width: 300px;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="sidebar">
      <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
      <h2>Admin Panel</h2>
      <div class="menu-item active" onclick="setActive(this)">
        📈 Statistics
      </div>
    </div>
    <div class="main-content">
      <h1>📊 Bảng Thống Kê Doanh Thu</h1>
      <div class="charts">
        <canvas id="revenueChart"></canvas>
        <canvas id="bookingChart"></canvas>
      </div>
    </div>
    <script>
      let revenueChart, bookingChart;
      function toggleSidebar() {
        document.querySelector(".sidebar").classList.toggle("collapsed");
        document.querySelector(".main-content").classList.toggle("collapsed");
      }
      async function fetchData() {
        try {
          const response = await fetch(`/api/statistics`);
          const data = await response.json();
          updateCharts(data.revenueByMonth, data.bookingRates);
        } catch (error) {
          console.error("Lỗi khi lấy dữ liệu:", error);
        }
      }
      function updateCharts(revenueData, bookingData) {
        if (revenueChart) revenueChart.destroy();
        if (bookingChart) bookingChart.destroy();
        const revenueCtx = document
          .getElementById("revenueChart")
          .getContext("2d");
        revenueChart = new Chart(revenueCtx, {
          type: "bar",
          data: {
            labels: Object.keys(revenueData),
            datasets: [
              {
                label: "Doanh thu ($)",
                data: Object.values(revenueData),
                backgroundColor: ["#007bff", "#00c3ff", "#28a745", "#dc3545"],
              },
            ],
          },
        });
        const bookingCtx = document
          .getElementById("bookingChart")
          .getContext("2d");
        bookingChart = new Chart(bookingCtx, {
          type: "pie",
          data: {
            labels: Object.keys(bookingData),
            datasets: [
              {
                data: Object.values(bookingData),
                backgroundColor: ["red", "blue", "green", "yellow"],
              },
            ],
          },
        });
      }
      document.addEventListener("DOMContentLoaded", fetchData);
    </script>
  </body>
</html>
